name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  constraint:
    name: No V4L2 in application code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Grep application sources for V4L2 usage
        run: scripts/check-no-v4l2.sh
