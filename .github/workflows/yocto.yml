name: Yocto image

# Builds the image with kas, boots it in QEMU and runs the validation script.
# A cold build takes several hours on a two-core hosted runner, so this only
# runs on demand: from the Actions tab ("Yocto image" -> Run workflow), for a
# release tag, or by pushing the commit to build to the branch "ci/yocto".
# The sstate cache is kept between runs.

on:
  workflow_dispatch:
    inputs:
      soak:
        description: Seconds of streaming to observe in QEMU
        default: "600"
  push:
    tags: ["v*"]
    branches: ["ci/yocto"]

permissions:
  contents: read

jobs:
  qemuarm64:
    name: kas build + QEMU validation (Track Q)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk wget git diffstat unzip texinfo gcc g++ make chrpath socat cpio python3 python3-pip \
            python3-pexpect python3-websockets xz-utils debianutils iputils-ping python3-git \
            python3-jinja2 python3-subunit zstd liblz4-tool file locales libacl1 \
            qemu-system-arm e2fsprogs ffmpeg
          sudo locale-gen en_US.UTF-8
          pip install --break-system-packages kas==5.5
          # BitBake isolates tasks in user namespaces, which Ubuntu 24.04
          # restricts through AppArmor by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore sstate cache
        uses: actions/cache/restore@v4
        with:
          path: build/sstate-cache
          key: sstate-qemuarm64-${{ github.run_id }}
          restore-keys: sstate-qemuarm64-

      - name: kas build
        run: kas build kas/isp-qemuarm64.yml:kas/opt/yocto-cache.yml:kas/opt/low-disk.yml

      # Saved even when the build fails or times out, so that the next run
      # resumes from what was already built.
      - name: Save sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/sstate-cache
          key: sstate-qemuarm64-${{ github.run_id }}

      - name: Boot in QEMU and validate
        run: scripts/qemu-validate.py --soak "${{ inputs.soak || '600' }}" --out evidence

      - name: Checksums
        if: always()
        run: |
          cd build/tmp/deploy/images/qemuarm64
          sha256sum Image isp-image-qemuarm64.rootfs.ext4 | tee "$GITHUB_WORKSPACE/evidence/SHA256SUMS"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-evidence
          path: evidence/

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: isp-image-qemuarm64
          path: |
            build/tmp/deploy/images/qemuarm64/Image
            build/tmp/deploy/images/qemuarm64/isp-image-qemuarm64.rootfs.ext4
            build/tmp/deploy/images/qemuarm64/isp-image-qemuarm64.rootfs.manifest
          compression-level: 9
