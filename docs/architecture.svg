<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#0f172a"/></marker></defs>
<rect width="1280" height="900" fill="#ffffff"/>
<text x="20" y="30" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">Camera ISP channel: architecture (Track Q, qemuarm64)</text>
<text x="900" y="30" font-size="14" font-weight="bold" fill="#475569" text-anchor="start">Same layer on a Raspberry Pi 4</text>
<text x="900" y="46" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">what replaces each block on real hardware</text>
<text x="20" y="82" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">Sensor</text>
<text x="20" y="100" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">virtual</text>
<rect x="150" y="60" width="720" height="62" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="164" y="84" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">Test-chart frames: 8 x 1920x1080 JPEG, played in a loop</text>
<text x="164" y="103" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">/usr/share/isp-channel/frames/  +  virtual.yaml (camera 'VirtualSensor0', 1080p30)</text>
<rect x="900" y="60" width="360" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="912" y="80" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">IMX219 / IMX477 / IMX708 image sensor</text>
<text x="912" y="96" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">RAW10/12 Bayer over MIPI CSI-2</text>
<text x="20" y="168" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">Kernel</text>
<text x="20" y="186" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">linux-yocto 6.6</text>
<rect x="150" y="146" width="720" height="62" rx="8" fill="#e0e7ff" stroke="#334155" stroke-width="1.5"/>
<text x="164" y="170" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">DMA-BUF system heap (fallback: udmabuf)</text>
<text x="164" y="189" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">frame-buffer memory only, enabled by a kernel config fragment; no capture driver</text>
<rect x="900" y="146" width="360" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="912" y="166" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Unicam CSI-2 receiver, bcm2835-isp (hardware ISP),</text>
<text x="912" y="182" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">bcm2835-codec (H.264). These drivers are V4L2</text>
<text x="912" y="198" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">inside the kernel; userspace still only sees libcamera.</text>
<text x="20" y="254" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">libcamera</text>
<text x="20" y="272" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">0.4.0</text>
<text x="20" y="287" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">pipeline handler</text>
<rect x="150" y="232" width="720" height="80" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="164" y="256" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">CameraManager  -&gt;  PipelineHandlerVirtual</text>
<text x="164" y="275" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">decodes the JPEGs, scales them with libyuv, copies one NV12 frame into a</text>
<text x="164" y="292" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">DMABUF FrameBuffer per queued Request. One NV12 stream, no RAW, no IPA, no pacing.</text>
<rect x="900" y="232" width="360" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="912" y="252" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">rpi/vc4 pipeline handler + Raspberry Pi IPA module</text>
<text x="912" y="268" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">+ per-sensor tuning file: AE, AWB, lens shading,</text>
<text x="912" y="284" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">CCM and gamma run in the IPA and the hardware ISP.</text>
<text x="912" y="300" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Viewfinder YUV420 and RAW Bayer streams together.</text>
<text x="20" y="362" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">Application</text>
<text x="20" y="380" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">isp-channel</text>
<text x="20" y="395" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">libcamera C++ API</text>
<text x="20" y="410" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">only (no V4L2)</text>
<rect x="150" y="340" width="720" height="330" rx="8" fill="#fff7ed" stroke="#334155" stroke-width="1.5"/>
<rect x="164" y="364" width="146" height="146" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="237.0" y="384" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">CameraSource</text>
<text x="173" y="406" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">enumerate, configure</text>
<text x="173" y="423" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">4 recycled Requests</text>
<text x="173" y="440" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">30 fps frame clock</text>
<text x="173" y="457" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">DMABUF mmap,</text>
<text x="173" y="474" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">read-only: zero copy</text>
<text x="173" y="491" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">control routing</text>
<rect x="346" y="364" width="146" height="146" rx="8" fill="#fde68a" stroke="#334155" stroke-width="1.5"/>
<text x="419.0" y="384" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">SensorModel</text>
<text x="355" y="406" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">the 'mosaic step'</text>
<text x="355" y="423" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">NV12 -&gt; linear light</text>
<text x="355" y="440" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">-&gt; inverse CCM</text>
<text x="355" y="457" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">-&gt; illuminant cast</text>
<text x="355" y="474" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">-&gt; exposure, pedestal</text>
<text x="355" y="491" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">-&gt; RAW10 RGGB</text>
<rect x="528" y="364" width="146" height="146" rx="8" fill="#fdba74" stroke="#334155" stroke-width="1.5"/>
<text x="601.0" y="384" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">SoftIsp</text>
<text x="537" y="406" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">1 black level</text>
<text x="537" y="423" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">2 white balance</text>
<text x="537" y="440" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">3 bilinear demosaic</text>
<text x="537" y="457" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">4 colour matrix</text>
<text x="537" y="474" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">5 gamma, bright/contr.</text>
<text x="537" y="491" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">6 RGB -&gt; I420 (BT.709)</text>
<rect x="710" y="364" width="146" height="146" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="783.0" y="384" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Encoder</text>
<text x="719" y="406" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">GStreamer appsrc</text>
<text x="719" y="423" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">ISP writes straight</text>
<text x="719" y="440" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">into the GstBuffer</text>
<text x="719" y="457" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">(no copy)</text>
<text x="719" y="474" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">back-pressure when</text>
<text x="719" y="491" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">the encoder is busy</text>
<line x1="310" y1="442" x2="344" y2="442" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
<text x="328.0" y="358" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="middle">NV12</text>
<line x1="492" y1="442" x2="526" y2="442" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
<text x="510.0" y="358" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="middle">RAW Bayer</text>
<line x1="674" y1="442" x2="708" y2="442" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
<text x="692.0" y="358" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="middle">I420</text>
<text x="601.0" y="525" font-size="10.5" font-weight="normal" fill="#9a3412" text-anchor="middle">row bands on N threads</text>
<rect x="164" y="536" width="160" height="118" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="244.0" y="555" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">IspController</text>
<text x="172" y="576" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">gray-world AWB, presets</text>
<text x="172" y="592" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">AE loop (mean luma)</text>
<text x="172" y="608" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">drives SoftIsp and the</text>
<text x="172" y="624" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">sensor exposure / gain</text>
<rect x="330" y="536" width="160" height="118" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="410.0" y="555" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Control inputs</text>
<text x="338" y="576" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">UNIX socket + isp-ctl:</text>
<text x="338" y="592" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">set / get / snapshot</text>
<text x="338" y="608" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">SIGUSR1: snapshot</text>
<text x="338" y="624" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">SIGTERM: clean stop</text>
<rect x="496" y="536" width="160" height="118" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="576.0" y="555" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">SnapshotWriter</text>
<text x="504" y="576" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">PNG of the ISP output</text>
<text x="504" y="592" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">own thread (libpng)</text>
<text x="504" y="608" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">self-test: PSNR vs</text>
<text x="504" y="624" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">the source picture</text>
<rect x="662" y="536" width="160" height="118" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="742.0" y="555" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">FrameStats</text>
<text x="670" y="576" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">FPS, per-stage ms,</text>
<text x="670" y="592" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">CPU %, RSS, drops</text>
<text x="670" y="608" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">one line per interval</text>
<text x="670" y="624" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">-&gt; journald</text>
<rect x="900" y="340" width="360" height="330" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="912" y="360" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">The RAW stream comes from the sensor, so the</text>
<text x="912" y="376" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">mosaic step is not used: CameraSource hands the</text>
<text x="912" y="392" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">camera's Bayer buffers to SoftIsp directly.</text>
<text x="912" y="408" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start"></text>
<text x="912" y="424" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">The hardware ISP already produces the YUV</text>
<text x="912" y="440" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">viewfinder; the software ISP then becomes the</text>
<text x="912" y="456" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">'own RAW stages' comparison of Track H.</text>
<text x="912" y="472" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start"></text>
<text x="912" y="488" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Controls are sent to the camera (it lists them</text>
<text x="912" y="504" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">in its ControlInfoMap) instead of being</text>
<text x="912" y="520" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">implemented in software.</text>
<text x="912" y="536" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start"></text>
<text x="912" y="552" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">The sensor paces the frames: frame-pacing = off.</text>
<text x="20" y="706" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">Encode + sink</text>
<text x="20" y="724" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">GStreamer 1.22</text>
<rect x="150" y="684" width="720" height="74" rx="8" fill="#fce7f3" stroke="#334155" stroke-width="1.5"/>
<text x="164" y="708" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">x264enc (software H.264)  -&gt;  splitmuxsink / mp4mux  -&gt;  /var/lib/isp-channel/isp-NNNNN.mp4</text>
<text x="164" y="727" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">ten one-minute MP4 segments kept as a ring. The pipeline is a configuration string:</text>
<text x="164" y="744" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">MJPEG (jpegenc) or RTP over UDP (rtph264pay ! udpsink) need no code change.</text>
<rect x="900" y="684" width="360" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="912" y="704" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Pi 4: hardware H.264 encoder (bcm2835-codec)</text>
<text x="912" y="720" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">selected in the same pipeline string.</text>
<text x="912" y="736" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Pi 5: no hardware encoder, software H.264 as here.</text>
<text x="20" y="794" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">System</text>
<text x="20" y="812" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">Yocto scarthgap</text>
<rect x="150" y="772" width="720" height="62" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="164" y="796" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">systemd: isp-channel.service (unprivileged user 'ispchannel', starts at boot)</text>
<text x="164" y="815" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">udev rule opens the DMABUF allocators to group 'video'; journald; dropbear SSH; networkd DHCP</text>
<rect x="900" y="772" width="360" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="912" y="792" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Same unit and image recipe. Boot firmware:</text>
<text x="912" y="808" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">camera_auto_detect=1, gpu_mem=76, cma=256M</text>
<line x1="830" y1="122" x2="830" y2="232" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
<text x="822" y="141" font-size="11" font-weight="normal" fill="#475569" text-anchor="end">JPEG files</text>
<line x1="700" y1="208" x2="700" y2="232" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
<text x="692" y="224" font-size="11" font-weight="normal" fill="#475569" text-anchor="end">DMABUF allocation</text>
<line x1="237.0" y1="312" x2="237.0" y2="363" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
<text x="247.0" y="330" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">completed Request: FrameBuffer (DMABUF fd)</text>
<line x1="850" y1="510" x2="850" y2="684" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
<text x="842" y="525" font-size="11" font-weight="normal" fill="#475569" text-anchor="end">I420 frames</text>
<text x="20" y="866" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Copies on the frame path: (1) libcamera fills the DMABUF  (2) the mosaic step reads it in place and writes RAW  (3) the ISP writes I420 into the encoder buffer  (4) x264 keeps its own reference frames.</text>
<text x="20" y="884" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Nothing else is copied; a snapshot adds one RGB888 buffer only for the frame being saved.</text>
</svg>
