# Distro policy for the camera ISP channel appliance.
#
# All build policy lives here, in the layer, so that local.conf stays the
# file kas generates and nothing else.

require conf/distro/poky.conf

DISTRO = "isp"
DISTRO_NAME = "ISP Channel Reference Distro"
DISTRO_VERSION = "1.0"
DISTROOVERRIDES = "poky:isp"

# The application is started by a systemd unit.
INIT_MANAGER = "systemd"

# Headless camera appliance: no display stack, no audio, no wireless.
# Dropping x11/wayland/opengl/vulkan keeps mesa and the GUI toolkits out of
# the GStreamer dependency tree, which shrinks both the image and the build.
DISTRO_FEATURES = "acl ext2 ipv4 ipv6 pci seccomp usbhost vfat xattr"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "pulseaudio gobject-introspection-data"

PACKAGE_CLASSES = "package_ipk"

# Software H.264 comes from x264 through the GStreamer x264enc element. Both
# recipes carry the "commercial" licence flag; accept it for exactly those two.
LICENSE_FLAGS_ACCEPTED = "commercial_x264 commercial_gstreamer1.0-plugins-ugly"

# GStreamer is used for encoding and muxing only. Build just the plugins the
# channel needs: appsrc (base), mp4/rtp/udp/splitmux and jpegenc (good),
# x264enc (ugly). In particular the GStreamer video4linux plugin is not built
# for QEMU, so nothing in the image can reach a capture device behind
# libcamera's back.
PACKAGECONFIG:pn-gstreamer1.0-plugins-base = "${GSTREAMER_ORC}"
PACKAGECONFIG:pn-gstreamer1.0-plugins-good = "${GSTREAMER_ORC} jpeg"
PACKAGECONFIG:pn-gstreamer1.0-plugins-ugly = "${GSTREAMER_ORC} x264"

# Minimal networking: systemd-networkd with DHCP on wired Ethernet.
PACKAGECONFIG:append:pn-systemd-conf = " dhcp-ethernet"

# libcamera pipeline handlers, per machine family.
#  - QEMU has no CSI receiver or ISP, so the virtual pipeline handler provides
#    the camera.
#  - Raspberry Pi 4 uses the Unicam + bcm2835-isp pipeline handler (rpi/vc4).
LIBCAMERA_PIPELINES:qemuall = "virtual"
LIBCAMERA_PIPELINES:rpi = "rpi/vc4"
