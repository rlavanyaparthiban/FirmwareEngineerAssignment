# isp-channel configuration for Raspberry Pi (build-only target, untested on
# hardware). The sensor paces the frames, so the application does not.

width = 1920
height = 1080
fps = 30
frame-pacing = off

ae = on
awb = on
awb-mode = auto
brightness = 0.0
contrast = 1.0

output = /var/lib/isp-channel
stats-interval = 10
