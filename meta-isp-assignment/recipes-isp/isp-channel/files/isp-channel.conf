# isp-channel configuration for QEMU (libcamera virtual pipeline handler).
# Every key can also be given on the command line as --key value.

# Viewfinder stream requested from the camera.
width = 1920
height = 1080
fps = 30

# The virtual camera returns a frame as soon as a request is queued, so the
# application keeps the 30 fps cadence itself.
frame-pacing = on

# The test frames are JPEG images: full-range YUV.
source-range = full

# Controls. The virtual camera offers none of these, so the software ISP
# implements them. All can be changed at run time with isp-ctl.
ae = on
awb = on
awb-mode = auto
brightness = 0.0
contrast = 1.0

# Software H.264 into one-minute MP4 segments, newest ten kept.
# MJPEG alternative:
#   pipeline = appsrc name=src ! jpegenc quality=85 ! splitmuxsink muxer-factory=matroskamux location=%OUTPUT%/isp-%05d.mkv max-size-time=60000000000 max-files=10
# RTP/H.264 over UDP to the QEMU host:
#   pipeline = appsrc name=src ! x264enc speed-preset=ultrafast tune=zerolatency bitrate=4000 key-int-max=60 ! rtph264pay config-interval=1 ! udpsink host=10.0.2.2 port=5000
output = /var/lib/isp-channel

stats-interval = 10
